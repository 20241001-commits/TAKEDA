<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方向探知レーダー</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            color: white;
            transition: background-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }
        #start-screen, #game-screen, #arrival-screen {
            padding: 20px;
        }
        button {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-cancel {
            background-color: #95a5a6; /* グレー */
        }
        #arrival-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .big-text {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
            line-height: 1.5;
        }
        .found-direction {
            background-color: #f1c40f !important;
            color: #2c3e50;
        }
        .destination-name {
            font-size: 32px;
            color: #e74c3c;
            display: block;
            margin-top: 10px;
        }
        #arrival-message {
            font-size: 36px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen">
        <h2>クエストスタート</h2>
        <p>位置情報とコンパスを使用します</p>
        <button id="start-btn">レーダー起動</button>
    </div>

    <!-- レーダー画面 -->
    <div id="game-screen" style="display: none;">
        <h2>クイズレーダー</h2>
        <div id="message" class="big-text">スマホを持って周りを見渡せ！</div>
        <p id="distance-info">位置情報を取得中...</p>
    </div>

    <!-- 到着画面 -->
    <div id="arrival-screen" style="display: none;">
        <h2 id="arrival-message" class="big-text"></h2>
        <div id="arrival-buttons">
            <button id="arrival-cancel-btn" class="btn-cancel">まだ到着してない</button>
            <button id="arrival-ok-btn">到着した！</button>
        </div>
    </div>

    <script>
        // クエストの座標リスト
        const TREASURES = [
            { name: "千古の家", lat: 36.1539527, lng: 136.3337006 },
            { name: "メロディパーク", lat: 36.1617997, lng: 139.3332570},
            { name: "ヤギ", lat: 36.1616538, lng: 136.3318184 },
            { name: "日吉神社", lat: 36.154939, lng: 136.332992 }, // ← カンマ抜けを修正しました
            { name: "ハゲ山", lat: 36.1646828, lng: 136.3347373},
            { name: "広瀬橋", lat: 36.1591056, lng: 136.3325134},
            { name: "予告灯", lat: 36.1602842, lng: 136.3323756},
        ];

        const ARRIVAL_RADIUS = 20; // 到着と判定する距離（メートル）

        let currentLat = null;
        let currentLng = null;
        let watchId = null;
        let foundPlaces = new Set(); 
        let isArrivedState = false; 
        let currentArrivedIndex = null;
        let ignoreArrivalIndex = -1; // 「まだ到着していない」を押した際に一時的に到着画面を無視するインデックス

        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const arrivalScreen = document.getElementById('arrival-screen');
        const arrivalMessage = document.getElementById('arrival-message');
        const arrivalOkBtn = document.getElementById('arrival-ok-btn');
        const arrivalCancelBtn = document.getElementById('arrival-cancel-btn');
        const messageDisplay = document.getElementById('message');
        const distanceInfo = document.getElementById('distance-info');

        // スタートボタン
        startBtn.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        alert('コンパスの使用が許可されませんでした。');
                        return;
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            startScreen.style.display = 'none';
            gameScreen.style.display = 'block';

            startGeolocation();
            window.addEventListener('deviceorientation', handleOrientation, true);
        });

        // 「到着した！」ボタンを押したときの処理
        arrivalOkBtn.addEventListener('click', () => {
            foundPlaces.add(currentArrivedIndex);
            
            isArrivedState = false;
            currentArrivedIndex = null;
            ignoreArrivalIndex = -1;
            
            arrivalScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            
            checkDistance(); 
        });

        // 「まだ到着してない」ボタンを押したときの処理
        arrivalCancelBtn.addEventListener('click', () => {
            ignoreArrivalIndex = currentArrivedIndex; 

            isArrivedState = false;
            currentArrivedIndex = null;
            
            arrivalScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            
            checkDistance();
        });

        // 位置情報の取得
        function startGeolocation() {
            if (!navigator.geolocation) {
                alert('このブラウザは位置情報に対応していません。');
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    checkDistance(); 
                },
                (error) => {
                    console.warn('位置情報の取得エラー:', error.message);
                    distanceInfo.innerText = "位置情報が取得できません";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        // 一番近い場所までの距離を計算して表示＆到着判定
        function checkDistance() {
            if (currentLat === null || isArrivedState) return;

            let minDistance = Infinity;
            let nearestPlace = "";
            let nearestIndex = -1;

            TREASURES.forEach((treasure, index) => {
                if (foundPlaces.has(index)) return; 

                const distance = calculateDistance(currentLat, currentLng, treasure.lat, treasure.lng);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestPlace = treasure.name;
                    nearestIndex = index;
                }
            });

            // 【変更点】誤判定キャンセルした場所から「25m以上離れる」または「10m以内に近づいた」場合に無視状態を解除
            if (ignoreArrivalIndex !== -1 && nearestIndex === ignoreArrivalIndex) {
                if (minDistance >= 25 || minDistance <= 10) {
                    ignoreArrivalIndex = -1;
                }
            }

            // 到着判定 (無視リストに入っていない場合のみ)
            if (minDistance <= ARRIVAL_RADIUS && nearestIndex !== -1 && nearestIndex !== ignoreArrivalIndex) {
                showArrivalScreen(nearestIndex, nearestPlace);
                return;
            }

            // 残りの目的地がある場合
            if (minDistance !== Infinity) {
                distanceInfo.innerText = `一番近い【${nearestPlace}】まで: 約 ${Math.round(minDistance)} m`;
            } else {
                distanceInfo.innerText = "レーダーの反応が消えました";
                document.body.classList.remove('found-direction');
                messageDisplay.innerHTML = "スマホを持って周りを見渡せ！";
            }
        }

        // 到着画面の表示
        function showArrivalScreen(index, name) {
            isArrivedState = true;
            currentArrivedIndex = index;
            document.body.classList.remove('found-direction'); 
            
            gameScreen.style.display = 'none';
            arrivalScreen.style.display = 'block';
            arrivalMessage.innerText = `${name} 到着！`;
        }

        // スマホの向き（コンパス）の処理
        function handleOrientation(event) {
            if (currentLat === null || gameScreen.style.display === 'none' || isArrivedState) return;
            if (foundPlaces.size === TREASURES.length) return;

            let heading = null;
            if (event.webkitCompassHeading) {
                heading = event.webkitCompassHeading; 
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha; 
            }
            if (heading === null) return;

            let targetTreasure = null;

            TREASURES.forEach((treasure, index) => {
                if (foundPlaces.has(index)) return; 

                let bearing = calculateBearing(currentLat, currentLng, treasure.lat, treasure.lng);
                let diff = Math.abs(heading - bearing);
                if (diff > 180) diff = 360 - diff;
                
                if (diff <= 10) { 
                    targetTreasure = treasure;
                }
            });

            if (targetTreasure) {
                document.body.classList.add('found-direction');
                messageDisplay.innerHTML = `✨ この方角にあります ✨<br><span class="destination-name">【 ${targetTreasure.name} 】</span>`;
            } else {
                document.body.classList.remove('found-direction');
                messageDisplay.innerHTML = "スマホを持って周りを見渡せ！";
            }
        }

        // 2点間の距離（メートル）を計算
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 2点間の方位角を計算
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const λ1 = lon1 * Math.PI / 180;
            const λ2 = lon2 * Math.PI / 180;
            const y = Math.sin(λ2 - λ1) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(λ2 - λ1);
            let θ = Math.atan2(y, x);
            return (θ * 180 / Math.PI + 360) % 360;
        }
    </script>
</body>
</html>
