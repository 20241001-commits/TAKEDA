<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方向探知レーダー</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            color: white;
            transition: background-color 0.2s ease; /* 色の切り替えを少し滑らかに */
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }
        #start-screen, #game-screen {
            padding: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        .big-text {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
            line-height: 1.5;
        }
        .found-direction {
            background-color: #f1c40f !important;
            color: #2c3e50;
        }
        .destination-name {
            font-size: 32px;
            color: #e74c3c;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen">
        <h2>クエストスタート</h2>
        <p>位置情報とコンパスを使用します</p>
        <button id="start-btn">レーダー起動</button>
    </div>

    <!-- レーダー画面 -->
    <div id="game-screen" style="display: none;">
        <h2>クイズレーダー</h2>
        <div id="message" class="big-text">スマホを持って周りを見渡せ！</div>
        <p id="distance-info">位置情報を取得中...</p>
    </div>

    <script>
        // クエストの座標リスト
        const TREASURES = [
            { name: "千古の家", lat: 36.1539527, lng: 136.3337006 },
            { name: "メロディパーク", lat: 36.1616815, lng: 139.637095 },
            { name: "ヤギ", lat: 36.1616538, lng: 136.3318184 },
            { name: "日吉神社", lat: 36.1670457, lng: 136.3310140 }, // ← カンマ抜けを修正しました
            { name: "ハゲ山", lat: 36.1646828, lng: 136.3347373},
            { name: "広瀬橋", lat: 36.1591056, lng: 136.3325134}
        ];

        let currentLat = null;
        let currentLng = null;
        let watchId = null;

        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const messageDisplay = document.getElementById('message');
        const distanceInfo = document.getElementById('distance-info');

        // スタートボタンを押した時の処理
        startBtn.addEventListener('click', async () => {
            // iOS向けのコンパス許可リクエスト
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        alert('コンパスの使用が許可されませんでした。');
                        return;
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            startScreen.style.display = 'none';
            gameScreen.style.display = 'block';

            startGeolocation();
            window.addEventListener('deviceorientation', handleOrientation, true);
        });

        // 位置情報の取得
        function startGeolocation() {
            if (!navigator.geolocation) {
                alert('このブラウザは位置情報に対応していません。');
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    checkDistance(); 
                },
                (error) => {
                    console.warn('位置情報の取得エラー:', error.message);
                    distanceInfo.innerText = "位置情報が取得できません";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        // 一番近い場所までの距離を計算して表示
        function checkDistance() {
            if (currentLat === null) return;

            let minDistance = Infinity;
            let nearestPlace = "";

            TREASURES.forEach((treasure) => {
                const distance = calculateDistance(currentLat, currentLng, treasure.lat, treasure.lng);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestPlace = treasure.name;
                }
            });

            if (minDistance !== Infinity) {
                distanceInfo.innerText = `一番近い【${nearestPlace}】まで: 約 ${Math.round(minDistance)} m`;
            }
        }

        // スマホの向き（コンパス）の処理
        function handleOrientation(event) {
            if (currentLat === null || gameScreen.style.display === 'none') return;

            let heading = null;
            if (event.webkitCompassHeading) {
                heading = event.webkitCompassHeading; // iOS Safari
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha; // Androidなど
            }
            if (heading === null) return;

            let targetTreasure = null;

            // 向いている方向に目的地があるか判定
            TREASURES.forEach((treasure) => {
                let bearing = calculateBearing(currentLat, currentLng, treasure.lat, treasure.lng);
                let diff = Math.abs(heading - bearing);
                if (diff > 180) diff = 360 - diff;
                
                // ±10度以内の方向を向いていたら反応する（5度だと厳しすぎるため調整）
                if (diff <= 10) { 
                    targetTreasure = treasure;
                }
            });

            // 画面の表示切り替え
            if (targetTreasure) {
                document.body.classList.add('found-direction');
                messageDisplay.innerHTML = `✨ この方角にあります ✨<br><span class="destination-name">【 ${targetTreasure.name} 】</span>`;
            } else {
                document.body.classList.remove('found-direction');
                messageDisplay.innerHTML = "スマホを持って周りを見渡せ！";
            }
        }

        // 2点間の距離（メートル）を計算
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 2点間の方位角を計算
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const λ1 = lon1 * Math.PI / 180;
            const λ2 = lon2 * Math.PI / 180;
            const y = Math.sin(λ2 - λ1) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(λ2 - λ1);
            let θ = Math.atan2(y, x);
            return (θ * 180 / Math.PI + 360) % 360;
        }
    </script>
</body>
</html>
